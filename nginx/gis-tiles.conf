# Static tile serving shared by BOTH nginx front ends (included inside their
# server {} block):
#   gateway (host port 5000) - the platform API entry point for apps
#   viewer  (host port 3100) - the optional web viewer
# Tiles are files on the gis-data volume (mounted read-only at /data):
# nginx sends them with sendfile, Python never runs per tile. Anything that is
# not a file on disk falls back to FastAPI (@api). Needs $gis_api set by the
# including server.

sendfile on;
tcp_nopush on;
open_file_cache max=100000 inactive=60s;
open_file_cache_valid 30s;
open_file_cache_errors on;

# Published (seamless, versioned) Terrarium WebP terrain. Tiles that were not
# written (flat base beyond the edge fade) fall back to the version's flat.webp.
location ~ "^/tiles/published/([0-9]{8}T[0-9]{6}-[0-9a-f]{8})/terrain/[0-9]+/[0-9]+/[0-9]+\.webp$" {
    root /data;
    types { image/webp webp; }
    try_files $uri /tiles/published/$1/flat.webp @api;
}
# The fallback targets themselves (internal try_files redirects land here).
location ~ "^/tiles/published/[0-9]{8}T[0-9]{6}-[0-9a-f]{8}/flat\.webp$" {
    root /data;
    types { image/webp webp; }
    try_files $uri @api;
}

# ArcGIS ImageServer Lerc tiles. The service metadata (?f=json) and tilemap
# are small dynamic JSON and stay on FastAPI; tiles not on disk go there too.
location ~ "^/arcgis/rest/services/([A-Za-z0-9_][A-Za-z0-9_-]*)/ImageServer/tile/([0-9]+)/([0-9]+)/([0-9]+)$" {
    root /data;
    default_type application/octet-stream;
    try_files /tiles/arcgis/rest/services/$1/tile/$2/$3/$4 @api;
}

# Imagery sets: files up to the set's maxzoom; over-zoom / outside the fetched
# area / unknown sets fall through to FastAPI (it crops/upscales).
location ~ "^/tiles/imagery-sets/([A-Za-z0-9_][A-Za-z0-9_-]*)/([0-9]+)/([0-9]+)/([0-9]+)$" {
    root /data;
    try_files /imagery/$1/$2/$3/$4.jpg /imagery/$1/$2/$3/$4.png /imagery/$1/$2/$3/$4.webp @api;
}

# FastAPI fallback. nginx already adds the tile CORS header for these URIs;
# hide FastAPI's copy so a browser never sees two Access-Control-Allow-Origin.
location @api {
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_pass http://$gis_api;
}
