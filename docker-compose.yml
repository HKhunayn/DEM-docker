# Shared json-file log rotation: at most 5 x 20 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  data-platform:
    build:
      context: ./gis-data-platform
      dockerfile: Dockerfile
    image: local-gis-data-platform:latest
    restart: unless-stopped
    # tini as PID 1: reaps the engine subprocesses (fetch/build/verify jobs and
    # their worker pools) and forwards SIGTERM so `compose stop` is clean.
    init: true
    # Give uvicorn and a running job time to shut down before SIGKILL.
    stop_grace_period: 60s
    logging: *default-logging
    # Hard memory ceiling for the API + tile builds. Keeps a country-scale
    # build from starving the Docker VM (that wedged the whole Docker engine
    # once). memswap = mem -> no swap thrash; the builders' pool watchdog
    # (engine/scripts/pool_runner.py) keeps usage under 75% of this cap.
    # Raise it if you give WSL more RAM in %UserProfile%\.wslconfig.
    mem_limit: ${GIS_PLATFORM_MEM_LIMIT:-20g}
    memswap_limit: ${GIS_PLATFORM_MEM_LIMIT:-20g}
    # Optional CPU cap (e.g. leave cores free for the desktop during a build):
    # cpus: "${GIS_PLATFORM_CPUS:-8}"
    environment:
      GIS_DATA_ROOT: /app/data
      HEIGHTMAP_ENGINE_ROOT: /opt/heightmap-30m
      HEIGHTMAP_PYTHON: /usr/local/bin/python
      LEAFLET_ROOT: /opt/leaflet
    volumes:
      - gis-data:/app/data
      # The DEM engine is baked into the image at /opt/heightmap-30m (copied
      # from gis-data-platform/engine). Uncomment to override it with a local
      # engine checkout while developing the engine itself:
      # - ${HEIGHTMAP_ENGINE_ROOT:-../heightmap-30m}:/opt/heightmap-30m:ro
    # Not published on the host: apps reach FastAPI through the gateway
    # (port 5000), which serves the tiles itself and proxies the rest here.
    expose:
      - "8787"
    networks:
      - gis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Platform entry point for apps (host port 5000): nginx serves every tile
  # file from the data volume (sendfile) and proxies everything else - REST
  # API, ImageServer metadata/tilemap, jobs, fetch page, /docs, tiles that are
  # not on disk - to FastAPI. Point other applications here.
  gateway:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      data-platform:
        condition: service_healthy
    volumes:
      - gis-data:/data:ro
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/gis-tiles.conf:/etc/nginx/gis/gis-tiles.conf:ro
    ports:
      - "${GIS_PLATFORM_PORT:-5000}:80"
    networks:
      - gis
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/gateway-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Optional web viewer (MapLibre / ArcGIS / Cesium) on host port 3100.
  viewer:
    build:
      context: ./gis-viewers
      dockerfile: Dockerfile
      args:
        VITE_PLATFORM_URL: ${VITE_PLATFORM_URL:-}
    image: local-gis-viewer:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      data-platform:
        condition: service_healthy
    # The tile trees are served by nginx straight from the data volume
    # (read-only): published terrain, ArcGIS Lerc tiles, imagery sets.
    volumes:
      - gis-data:/data:ro
      - ./nginx/gis-tiles.conf:/etc/nginx/gis/gis-tiles.conf:ro
    ports:
      - "${GIS_VIEWER_PORT:-3100}:80"
    networks:
      - gis

volumes:
  gis-data:

networks:
  gis:
    driver: bridge
