# Installed as /etc/nginx/conf.d/default.conf (inside the http {} block).

# Cache policy by URI (evaluated after try_files, so SPA fallbacks resolve to
# /index.html). Empty value = header not added, so proxied API responses keep
# whatever the data platform sends.
map $uri $gis_cache_control {
    default         "";
    ~^/assets/      "public, max-age=31536000, immutable";
    /               "no-cache";
    /index.html     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml application/wasm;

    # Inherited by every location below (none of them sets its own add_header;
    # adding one in a location would drop all of these there).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $gis_cache_control;

    # Resolve data-platform per request through Docker's embedded DNS instead
    # of once at startup: recreating the API container (new IP) no longer
    # leaves nginx proxying a stale address, and nginx still starts (answering
    # 502) while the API is down. This needs proxy_pass with a variable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $gis_api data-platform:8787;

    # Shared proxy settings, inherited by the proxied locations.
    # Host MUST be $http_host (keeps the port): the API builds absolute catalog
    # and TileJSON URLs from it.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE: proxy_pass with a variable and NO URI part forwards the original
    # request URI unchanged (no prefix replacement). Every mapping below is
    # identity (/api/x -> /api/x), i.e. exactly the previous behaviour. Do not
    # append a path to these proxy_pass lines.

    # Keep the browser same-origin in the composed deployment. The viewer
    # defaults to window.location.origin when VITE_PLATFORM_URL is empty.
    location /api/ {
        proxy_pass http://$gis_api;
    }

    location /tiles/ {
        proxy_pass http://$gis_api;
    }

    location /arcgis/ {
        proxy_pass http://$gis_api;
    }

    # Exact match: a prefix "location /health" would also proxy /healthX.
    location = /health {
        proxy_pass http://$gis_api;
    }

    # Fetch page: the API serves /fetch, /fetch/ and /fetch/index.html; its
    # Leaflet assets are under /vendor/. "= /fetch" avoids matching /fetchX.
    location = /fetch {
        proxy_pass http://$gis_api;
    }

    location /fetch/ {
        proxy_pass http://$gis_api;
    }

    location /vendor/ {
        proxy_pass http://$gis_api;
    }
}
