# Viewer nginx (host port GIS_VIEWER_PORT, default 3100). Installed as
# /etc/nginx/conf.d/default.conf (inside the http {} block).
#
# The viewer has NO data volume: it serves the SPA and proxies
#   /api /tiles /arcgis /health -> the ENGINE (engine:80 - its nginx serves the
#                                  tile files, FastAPI the rest)
#   /fetch /fetch/ /vendor/     -> the DATA-PLATFORM (downloads; optional - a
#                                  friendly page says so when it is stopped)

# Cache policy by URI (evaluated after try_files, so SPA fallbacks resolve to
# /index.html). Empty value = header not added; proxied responses keep the
# engine's own Cache-Control (immutable published tiles, ...).
map $uri $gis_cache_control {
    default         "";
    ~^/assets/      "public, max-age=31536000, immutable";
    /               "no-cache";
    /index.html     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml application/wasm;

    # Inherited by every location below (none of them sets its own add_header;
    # adding one in a location would drop all of these there).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $gis_cache_control;
    # the engine sends its own copy; never forward two
    proxy_hide_header X-Content-Type-Options;

    # Resolve the upstreams per request through Docker's embedded DNS instead
    # of once at startup: recreating a container (new IP) never leaves nginx
    # proxying a stale address, and nginx still starts (answering 502) while
    # an upstream is down. This needs proxy_pass with a variable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $gis_engine engine:80;
    set $gis_platform data-platform:8787;

    # Shared proxy settings, inherited by the proxied locations.
    # Host MUST be $http_host (keeps the port): the engine builds absolute
    # catalog and TileJSON URLs from it.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE: proxy_pass with a variable and NO URI part forwards the original
    # request URI unchanged (no prefix replacement). Do not append a path.

    # ---- engine: tiles (its nginx serves the files), metadata, catalog ----
    # The viewer defaults to window.location.origin when VITE_PLATFORM_URL is
    # empty, so the browser stays same-origin.
    location /api/ {
        proxy_pass http://$gis_engine;
    }

    location /tiles/ {
        proxy_pass http://$gis_engine;
    }

    location /arcgis/ {
        proxy_pass http://$gis_engine;
    }

    # Exact match: a prefix "location /health" would also proxy /healthX.
    location = /health {
        proxy_pass http://$gis_engine;
    }

    # ---- data-platform: the fetch page (downloads) ----
    # The page uses relative urls (api/..., vendor/...), which land under
    # /fetch/ and are answered by the data-platform. "= /fetch" avoids /fetchX.
    location = /fetch {
        proxy_pass http://$gis_platform;
        error_page 502 503 504 = @platform_down;
    }

    location /fetch/ {
        proxy_pass http://$gis_platform;
        error_page 502 503 504 = @platform_down;
    }

    location /vendor/ {
        proxy_pass http://$gis_platform;
        error_page 502 503 504 = @platform_down;
    }

    location @platform_down {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Data-platform not running</title>
<meta http-equiv="refresh" content="15"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;color:#1a1a1a}
.box{padding:16px 18px;border-radius:10px;background:#fef3c7;color:#92400e}code{background:#f3f4f6;padding:1px 5px;border-radius:4px}</style></head>
<body><div class="box"><b>The data-platform (downloads) is not running.</b><br>
The fetch page belongs to the data-platform app. Start it with <code>docker compose up -d data-platform</code>
(or <code>Run.bat up data-platform</code>); this page retries every 15 s.</div>
<p>The engine keeps serving every area that is already built - the viewer (<a href="/">back to the viewer</a>) and other apps are not affected.</p></body></html>';
    }
}
