# Installed as /etc/nginx/conf.d/default.conf (inside the http {} block).

# Cache policy by URI (evaluated after try_files, so SPA fallbacks resolve to
# /index.html). Empty value = header not added, so proxied API responses keep
# whatever the data platform sends.
map $uri $gis_cache_control {
    default         "";
    ~^/assets/      "public, max-age=31536000, immutable";
    /               "no-cache";
    /index.html     "no-cache";
    # Static tiles served straight from the data volume (see below). Published
    # sets live under a per-build version directory -> immutable.
    ~^/tiles/published/                         "public, max-age=31536000, immutable";
    ~^/tiles/arcgis/rest/services/[^/]+/tile/   "public, max-age=3600";
    ~^/imagery/                                 "public, max-age=3600";
}

# Tiles are fetched cross-origin by some clients (ArcGIS/Cesium on another
# port, QGIS, ...): allow any origin for the static tile URIs only.
map $uri $gis_tile_cors {
    default                                     "";
    ~^/tiles/published/                         "*";
    ~^/tiles/arcgis/rest/services/[^/]+/tile/   "*";
    ~^/imagery/                                 "*";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml application/wasm;

    # Inherited by every location below (none of them sets its own add_header;
    # adding one in a location would drop all of these there).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $gis_cache_control;
    add_header Access-Control-Allow-Origin $gis_tile_cors;

    # Resolve data-platform per request through Docker's embedded DNS instead
    # of once at startup: recreating the API container (new IP) no longer
    # leaves nginx proxying a stale address, and nginx still starts (answering
    # 502) while the API is down. This needs proxy_pass with a variable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $gis_api data-platform:8787;

    # Shared proxy settings, inherited by the proxied locations.
    # Host MUST be $http_host (keeps the port): the API builds absolute catalog
    # and TileJSON URLs from it.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE: proxy_pass with a variable and NO URI part forwards the original
    # request URI unchanged (no prefix replacement). Every mapping below is
    # identity (/api/x -> /api/x), i.e. exactly the previous behaviour. Do not
    # append a path to these proxy_pass lines.

    # Keep the browser same-origin in the composed deployment. The viewer
    # defaults to window.location.origin when VITE_PLATFORM_URL is empty.
    location /api/ {
        proxy_pass http://$gis_api;
    }

    location /tiles/ {
        proxy_pass http://$gis_api;
    }

    location /arcgis/ {
        proxy_pass http://$gis_api;
    }

    # ---- static tiles straight from the data volume (no Python per tile) ----
    # The gis-data volume is mounted read-only at /data, so a URI maps to the
    # file /data/tiles/... . sendfile + open_file_cache: zero-copy serving.
    sendfile on;
    tcp_nopush on;
    open_file_cache max=100000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_errors on;

    # Published (seamless, versioned) terrain. Tiles that were not written
    # (flat base beyond the edge fade) fall back to the version's flat.webp.
    # Version names are fixed-format. No server hillshade: the viewers shade
    # the elevation tiles in the browser.
    location ~ "^/tiles/published/([0-9]{8}T[0-9]{6}-[0-9a-f]{8})/terrain/[0-9]+/[0-9]+/[0-9]+\.webp$" {
        root /data;
        types { image/webp webp; }
        try_files $uri /tiles/published/$1/flat.webp =404;
    }
    # The fallback targets themselves (internal try_files redirects land here).
    location ~ "^/tiles/published/[0-9]{8}T[0-9]{6}-[0-9a-f]{8}/flat\.webp$" {
        root /data;
        types { image/webp webp; }
    }

    # ArcGIS ImageServer Lerc tiles (ArcGIS Maps SDK + CesiumJS terrain).
    # Metadata, tilemap and anything not on disk still go to the API (404s).
    location ~ "^/arcgis/rest/services/([A-Za-z0-9_][A-Za-z0-9_-]*)/ImageServer/tile/([0-9]+)/([0-9]+)/([0-9]+)$" {
        root /data;
        default_type application/octet-stream;
        try_files /tiles/arcgis/rest/services/$1/tile/$2/$3/$4 @api;
    }

    # Imagery sets: files up to the set's maxzoom; over-zoom / outside the
    # fetched area / unknown sets fall through to the API (it crops/upscales).
    location ~ "^/tiles/imagery-sets/([A-Za-z0-9_][A-Za-z0-9_-]*)/([0-9]+)/([0-9]+)/([0-9]+)$" {
        root /data;
        try_files /imagery/$1/$2/$3/$4.jpg /imagery/$1/$2/$3/$4.png /imagery/$1/$2/$3/$4.webp @api;
    }

    location @api {
        proxy_pass http://$gis_api;
    }

    # Exact match: a prefix "location /health" would also proxy /healthX.
    location = /health {
        proxy_pass http://$gis_api;
    }

    # Fetch page: the API serves /fetch, /fetch/ and /fetch/index.html; its
    # Leaflet assets are under /vendor/. "= /fetch" avoids matching /fetchX.
    location = /fetch {
        proxy_pass http://$gis_api;
    }

    location /fetch/ {
        proxy_pass http://$gis_api;
    }

    location /vendor/ {
        proxy_pass http://$gis_api;
    }
}
