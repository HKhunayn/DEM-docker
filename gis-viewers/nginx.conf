server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep the browser same-origin in the composed deployment. The viewer
    # defaults to window.location.origin when VITE_PLATFORM_URL is empty.
    location /api/ {
        proxy_pass http://data-platform:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tiles/ {
        proxy_pass http://data-platform:8787/tiles/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /arcgis/ {
        proxy_pass http://data-platform:8787/arcgis/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://data-platform:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location /fetch/ {
        proxy_pass http://data-platform:8787/fetch/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /fetch {
        proxy_pass http://data-platform:8787/fetch;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vendor/ {
        proxy_pass http://data-platform:8787/vendor/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
}
