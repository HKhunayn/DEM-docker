# Main nginx config of the ENGINE container (Debian nginx package, replaces
# /etc/nginx/nginx.conf). Logs go to the container's stdout/stderr; the
# server block is conf.d/default.conf (engine.conf), the tile locations
# gis/gis-tiles.conf.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/conf.d/*.conf;
}
