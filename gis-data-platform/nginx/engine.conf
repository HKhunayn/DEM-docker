# ENGINE nginx (port 80 in the engine container, published on the host as
# GIS_ENGINE_PORT, default 5000) - the address the user's apps use:
#   tiles  -> files on the data volume (gis-tiles.conf, sendfile)
#   rest   -> the engine's FastAPI on 127.0.0.1:8787 (same container):
#             ImageServer metadata ?f=json + tilemap, /tiles/terrain.json,
#             read-only catalog/areas, tile status, build jobs, /docs, /health,
#             and any tile that is not on disk (over-zoom, imagery crops).
# Installed as /etc/nginx/conf.d/default.conf (inside the http {} block).

# $request_uri, not $uri: try_files rewrites $uri to the file path
# (/tiles/arcgis/...), which would miss these patterns.
map $request_uri $gis_cache_control {
    default                                     "";
    ~^/tiles/published/                         "public, max-age=31536000, immutable";
    ~^/arcgis/rest/services/[^/]+/ImageServer/tile/  "public, max-age=3600";
    ~^/tiles/imagery-sets/                      "public, max-age=3600";
}

# Static tile URIs: any origin (ArcGIS JS / Cesium / MapLibre apps on other
# hosts). API responses carry FastAPI's own CORS headers.
map $request_uri $gis_tile_cors {
    default                                     "";
    ~^/tiles/published/                         "*";
    ~^/arcgis/rest/services/[^/]+/ImageServer/tile/  "*";
    ~^/tiles/imagery-sets/                      "*";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $gis_cache_control;
    # always: also on fallback 404s, or browsers report them as CORS errors
    add_header Access-Control-Allow-Origin $gis_tile_cors always;

    # The engine's FastAPI runs in this container: an IP literal needs no
    # resolver, and nginx answers 502 while uvicorn (re)starts.
    set $gis_api 127.0.0.1:8787;

    # Host MUST be $http_host (keeps :5000): FastAPI builds absolute URLs
    # (terrain.json tiles, catalog links) from it.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 16m;

    include /etc/nginx/gis/gis-tiles.conf;

    # Everything else is the engine's FastAPI. proxy_pass with a variable and
    # NO URI part forwards the request URI unchanged.
    location / {
        proxy_pass http://$gis_api;
    }

    # nginx itself (no API round trip).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
